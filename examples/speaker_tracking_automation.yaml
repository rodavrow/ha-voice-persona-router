# Example: keep one "who is speaking" helper per voice satellite up to date.
#
# The router reads input_text.voice_speaker_<device id of the satellite>.
# This automation writes one of these values into it:
#   pending   the wake word was heard, the voice match has not arrived yet
#   owner     Person 1 in the router settings
#   partner   Person 2 in the router settings
#   stranger  anybody else
#
# It was written for EchoLocal satellites (https://github.com/ygelfand/echolocal)
# and their voice match. It assumes each satellite device has two sensors
# from its speaker recognition: one whose entity id ends in _last_speaker (the recognised
# name) and one that ends in _last_speaker_score. Change the entity ids and
# the two names (Alex and Sam here) to match your own setup. If your speaker
# recognition reports its result some other way, only the triggers and the
# "speaker" variable need to change.

alias: "Voice: track who is speaking"
description: Sets input_text.voice_speaker_<satellite device id> to owner, partner, stranger or pending.
mode: queued
max: 10
variables:
  dev: "{{ device_id(trigger.entity_id) }}"
triggers:
  - trigger: state
    id: wake
    entity_id:
      - assist_satellite.kitchen_satellite
      - assist_satellite.office_satellite
    to: listening
  - trigger: state
    id: score
    entity_id:
      - sensor.kitchen_satellite_last_speaker_score
      - sensor.office_satellite_last_speaker_score
    not_to:
      - unavailable
      - unknown
actions:
  - variables:
      helper: "{{ 'input_text.voice_speaker_' ~ dev }}"
  - choose:
      - conditions:
          - condition: trigger
            id: wake
          # A listen that starts within 2 seconds of the reply ending is a
          # follow-up question with no wake word and no new voice match, so
          # the speaker of the turn before carries over.
          - condition: template
            value_template: >-
              {{ not (trigger.from_state.state == 'idle' and
              (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() < 2) }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ helper }}"
            data:
              value: pending
      - conditions:
          - condition: trigger
            id: score
        sequence:
          - variables:
              speaker: >-
                {{ states(device_entities(dev) | select('search', '_last_speaker$')
                | first | default('none.none', true)) }}
          - variables:
              role: "{{ {'Alex': 'owner', 'Sam': 'partner'}.get(speaker, 'stranger') }}"
          - action: input_text.set_value
            target:
              entity_id: "{{ helper }}"
            data:
              value: "{{ role }}"
